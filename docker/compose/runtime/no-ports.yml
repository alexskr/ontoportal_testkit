# Strips host port bindings from backing services in :container mode, so parallel
# runs (different backends, different components) don't collide on host ports.
# Services still reach each other by name over the compose network.
#
# The `!override` tag is required: compose *concatenates* `ports` across `-f`
# files, so a bare `ports: []` merges into base.yml's list and is a silent no-op.
# Requires Docker Compose v2.24.0+.
services:
  redis-ut:
    ports: !override []
  solr-ut:
    ports: !override []
  agraph-ut:
    ports: !override []
  4store-ut:
    ports: !override []
  virtuoso-ut:
    ports: !override []
  graphdb-ut:
    ports: !override []
